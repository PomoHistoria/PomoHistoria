spring:
  application:
    name: PomoHistoria
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pomohistoria}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      # O esquema é controlado só pelo Flyway; o Hibernate apenas confere.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}
  shutdown: graceful
  # Lê o IP real do cliente e o HTTPS a partir dos headers do proxy da hospedagem (ex.: Render).
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:native}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      tracking-modes: cookie
      cookie:
        http-only: true
        # Produção: front e back em domínios diferentes exigem SameSite=None + Secure (HTTPS).
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: ${SESSION_COOKIE_SAME_SITE:none}

app:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  cors:
    # URLs do frontend separadas por vírgula, sem barra no final. Ex.: https://pomohistoria.vercel.app
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  security:
    login:
      max-falhas-por-email: ${LOGIN_MAX_FALHAS_POR_EMAIL:5}
      max-falhas-por-ip: ${LOGIN_MAX_FALHAS_POR_IP:50}
      bloqueio-minutos: ${LOGIN_BLOQUEIO_MINUTOS:15}
